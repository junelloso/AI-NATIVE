name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. SECRET SCANNING — runs first, cheapest gate
  # ────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for Gitleaks
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────
  # 2. PYTHON LINT + TYPE CHECK + TEST
  # ────────────────────────────────────────────────────────────
  python-checks:
    name: Python (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . --output-format=github
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app --strict
      - name: Tests (pytest)
        run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=80
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────
  # 3. FRONTEND LINT + TYPE CHECK + TEST
  # ────────────────────────────────────────────────────────────
  frontend-checks:
    name: Frontend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run type-check
      - name: Tests (Vitest)
        run: npm run test -- --coverage

  # ────────────────────────────────────────────────────────────
  # 4. SAST — Static Application Security Testing
  # ────────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: [secrets-scan]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
            p/typescript
          generateSarif: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ────────────────────────────────────────────────────────────
  # 5. IaC VALIDATION
  # ────────────────────────────────────────────────────────────
  iac-validate:
    name: IaC Validation (Terraform)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'infra/') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform/
      - name: Terraform validate
        run: |
          cd infra/terraform/modules
          for d in */; do
            echo "Validating module: $d"
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
          done

  # ────────────────────────────────────────────────────────────
  # 6. BUILD + CONTAINER SCAN
  # ────────────────────────────────────────────────────────────
  build-and-scan:
    name: Build + Trivy Scan
    runs-on: ubuntu-latest
    needs: [python-checks, frontend-checks, sast]
    strategy:
      matrix:
        service: [api, frontend, ai-agent]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            -t ai-native/${{ matrix.service }}:${{ github.sha }} \
            services/${{ matrix.service }}/
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-native/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"         # Fail on CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  # ────────────────────────────────────────────────────────────
  # 7. SUMMARY GATE — all must pass before merge
  # ────────────────────────────────────────────────────────────
  ci-passed:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [secrets-scan, python-checks, frontend-checks, sast, iac-validate, build-and-scan]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"

name: Daily Security Scan

on:
  schedule:
    - cron: "0 2 * * *"    # 2 AM UTC daily
  workflow_dispatch:         # Allow manual trigger

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt --format json -o pip-audit.json
      - name: Node dependency audit
        run: |
          cd services/frontend
          npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            pip-audit.json
            services/frontend/npm-audit.json

  trivy-full-scan:
    name: Trivy Full Repo Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-repo.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-repo.sarif

  iac-drift-check:
    name: Terraform Drift Detection
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_READONLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Terraform plan (drift detection)
        run: |
          cd infra/terraform/environments/prod
          terraform init
          terraform plan -detailed-exitcode -out=drift.tfplan || \
            (echo "DRIFT DETECTED in production infrastructure" && exit 1)
